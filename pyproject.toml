[build-system]
requires = [
	"setuptools>=77",
	"setuptools_scm[toml]>=3.4.1",
	# jaraco/skeleton#174
	"coherent.licensed",
]
build-backend = "setuptools.build_meta"

[project]
name = "wolframalpha"
authors = [
	{ name = "Jason R. Coombs", email = "jaraco@jaraco.com" },
]
description = "Wolfram|Alpha 2.0 API client"
readme = "README.rst"
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: Developers",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.10"
license = "MIT"
dependencies = [
	"xmltodict",
	"more_itertools",
	"jaraco.context",
	"httpx",
	"multidict",
]
dynamic = ["version"]

[project.urls]
Source = "https://github.com/jaraco/wolframalpha"

[project.optional-dependencies]
test = [
	# upstream
	"pytest >= 6, != 8.1.*",

	# local
	# pmxbot is uninstallable on free-threaded Python on Windows (#37)
	"pmxbot; sys_platform != 'win32'",
	"keyring",
]

doc = [
	# upstream
	"sphinx >= 3.5",
	"jaraco.packaging >= 9.3",
	"rst.linker >= 1.9",
	"furo",
	"sphinx-lint",

	# local
]

check = [
	"pytest-checkdocs >= 2.14",
	"pytest-ruff >= 0.2.1; sys_platform != 'cygwin'",
]

cover = [
	"pytest-cov",
]

enabler = [
	"pytest-enabler >= 3.4",
]

type = [
	# upstream
	
	# Exclude PyPy from type checks (python/mypy#20454 jaraco/skeleton#187)
	"pytest-mypy >= 1.0.1; platform_python_implementation != 'PyPy'",

	# local
	"types-xmltodict",
]


[project.entry-points]
pmxbot_handlers = {"Wolfram|Alpha" = "wolframalpha.pmxbot"}


[tool.setuptools_scm]


[tool.pytest-enabler.mypy]
# Disabled due to jaraco/skeleton#143
